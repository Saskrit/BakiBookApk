# BakiBook APK download site — download.bakibook.run.place

root /var/www/bakibook/download;
index index.html;

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
}

location = / {
    try_files /index.html =404;
}

location /apk/ {
    alias /var/www/bakibook/download/apk/;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="BakiBook.apk"' always;
    add_header Cache-Control 'public, max-age=300' always;
}

location /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}
