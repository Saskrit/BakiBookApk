# BakiBook — https://api.bakibook.run.place/api (backend)
#           https://bakibook.run.place (frontend — HTTP also works)
# Cert: /etc/letsencrypt/live/bakibook.run.place/

upstream bakibook_api {
    server 127.0.0.1:5001;
    keepalive 32;
}

# HTTP — frontend (React app)
server {
    listen 80;
    listen [::]:80;
    server_name bakibook.run.place www.bakibook.run.place;

    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Serve both apex and www (no redirect) so site works even if apex DNS is stale
    root /var/www/bakibook/client/dist;
    index index.html;

    include /etc/nginx/snippets/bakibook-frontend-locations.conf;
}

# HTTP — API → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.bakibook.run.place;

    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP — bare IP / unknown host → frontend
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://www.bakibook.run.place$request_uri;
}

# HTTPS — API backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bakibook.run.place;

    client_max_body_size 15m;

    ssl_certificate /etc/letsencrypt/live/bakibook.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakibook.run.place/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/bakibook-api-locations.conf;
}

# HTTPS — frontend (React app)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bakibook.run.place www.bakibook.run.place;

    client_max_body_size 15m;

    ssl_certificate /etc/letsencrypt/live/bakibook.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakibook.run.place/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/bakibook/client/dist;
    index index.html;

    include /etc/nginx/snippets/bakibook-frontend-locations.conf;
}
