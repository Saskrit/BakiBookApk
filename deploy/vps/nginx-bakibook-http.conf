# Bootstrap HTTP config — used until Let's Encrypt cert is issued.

upstream bakibook_api {
    server 127.0.0.1:5001;
    keepalive 32;
}

# Frontend (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name bakibook.run.place www.bakibook.run.place;

    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    if ($host = www.bakibook.run.place) {
        return 301 http://bakibook.run.place$request_uri;
    }

    root /var/www/bakibook/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API (HTTP — proxied until cert exists)
server {
    listen 80;
    listen [::]:80;
    server_name api.bakibook.run.place;

    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    include /etc/nginx/snippets/bakibook-api-locations.conf;
}

# Default → frontend
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 http://bakibook.run.place$request_uri;
}
