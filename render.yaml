# Render Blueprint — BakiBook API + Web (one service)
# Dashboard: https://dashboard.render.com → New → Blueprint
# Docs: deploy/render/DEPLOY_RENDER.md

services:
  - type: web
    name: bakibook
    runtime: node
    plan: starter
    region: singapore
    rootDir: .
    buildCommand: npm run build:render
    startCommand: NODE_ENV=production npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
